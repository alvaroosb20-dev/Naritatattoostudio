<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página no encontrada · Narita Tattoo Studio</title>
  <meta name="description" content="La página que buscas no existe.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <header class="header is-scrolled" data-header>
    <div class="header__inner">
      <a class="brand" href="/" aria-label="Narita Tattoo Studio, inicio">
        <img class="brand__mark" src="/assets/img/ginkgo-dorado.png" alt="" width="44" height="28">
        <span class="brand__name">Narita <span>Tattoo Studio</span></span>
      </a>
      <a class="btn btn--ghost nav__cta" href="/">VOLVER A LA WEB</a>
    </div>
  </header>

  <main class="error-page" id="contenido">
    <div class="error-page__ring" aria-hidden="true"><span>404</span></div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al inicio o mira el portafolio.</p>
    <div class="error-page__actions">
      <a class="btn btn--gold" href="/">IR AL INICIO</a>
      <a class="btn btn--ghost" href="/#portafolio">VER PORTAFOLIO</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__legal">
      <p>© <span data-year></span> Narita Tattoo Studio</p>
      <nav aria-label="Legal">
        <a href="/privacidad">Política de privacidad</a>
        <a href="/aviso-legal">Aviso legal</a>
        <a href="/cookies">Política de cookies</a>
      </nav>
    </div>
  </footer>
</body>
</html>
